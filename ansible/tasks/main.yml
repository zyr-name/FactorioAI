---
- name: Require an x86-64 target
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in ['x86_64', 'amd64']
    fail_msg: >-
      This image is configured for linux/amd64. Target architecture is
      {{ ansible_facts.architecture }}.

- name: Check Docker Engine and Compose plugin
  ansible.builtin.command: "{{ factorio_docker_bin }} compose version"
  changed_when: false

- name: Check rsync is available on the controller
  ansible.builtin.command: rsync --version
  delegate_to: localhost
  become: false
  changed_when: false

- name: Create Factorio service group
  ansible.builtin.group:
    name: factorio
    system: true
    gid: 845

- name: Create Factorio service user and home directory
  ansible.builtin.user:
    name: factorio
    group: factorio
    uid: 845
    home: /home/factorio
    create_home: true
    system: true
    shell: /usr/sbin/nologin

- name: Ensure Factorio install directory is the service user's home
  ansible.builtin.file:
    path: /home/factorio
    state: directory
    owner: factorio
    group: factorio
    mode: '0755'

- name: Create persistent Factorio data directory
  ansible.builtin.file:
    path: /home/factorio/data
    state: directory
    owner: factorio
    group: factorio
    mode: '0750'

- name: Create temporary source staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: factorio-source-
  register: factorio_source_staging
  become: false

- name: Synchronize the Factorio project to staging
  ansible.posix.synchronize:
    src: "{{ factorio_source_dir }}/"
    dest: "{{ factorio_source_staging.path }}/"
    archive: false
    recursive: true
    times: true
    delete: true
    rsync_opts:
      - '--exclude=.git/'
      - '--exclude=.env'
      - '--exclude=data/'
      - '--exclude=backups/'
  delegate_to: localhost
  become: false

- name: Install staged project into Factorio home
  ansible.builtin.copy:
    src: "{{ factorio_source_staging.path }}/"
    dest: /home/factorio/
    remote_src: true
    owner: factorio
    group: factorio
    mode: preserve

- name: Remove temporary source staging directory
  ansible.builtin.file:
    path: "{{ factorio_source_staging.path }}"
    state: absent
  become: false

- name: Render deployment environment
  ansible.builtin.template:
    src: factorio.env.j2
    dest: /home/factorio/.env
    owner: factorio
    group: factorio
    mode: '0600'

- name: Install UFW when firewall management is enabled
  ansible.builtin.package:
    name: ufw
    state: present
  when: factorio_manage_firewall | bool

- name: Allow Factorio game traffic through UFW
  community.general.ufw:
    rule: allow
    port: "{{ factorio_port }}"
    proto: udp
  when: factorio_manage_firewall | bool

- name: Install systemd unit
  ansible.builtin.template:
    src: factorio.service.j2
    dest: /etc/systemd/system/factorio.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Factorio service

- name: Validate Compose configuration
  ansible.builtin.command: "{{ factorio_docker_bin }} compose config --quiet"
  args:
    chdir: /home/factorio
  changed_when: false

- name: Build and start Factorio
  ansible.builtin.command: "{{ factorio_docker_bin }} compose up -d --build"
  args:
    chdir: /home/factorio
  register: factorio_compose_up
  changed_when: >-
    'Started' in factorio_compose_up.stdout or
    'Recreated' in factorio_compose_up.stdout or
    'Created' in factorio_compose_up.stdout

- name: Enable and start Factorio at boot
  ansible.builtin.systemd:
    name: factorio.service
    enabled: true
    state: started
    daemon_reload: true
