---
- name: Deploy Factorio server
  hosts: factorio
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/factorio.yml

  tasks:
    - name: Run Factorio deployment tasks
      ansible.builtin.import_tasks: ../tasks/main.yml

  handlers:
    - name: Load Factorio handlers
      ansible.builtin.import_tasks: ../handlers/main.yml
